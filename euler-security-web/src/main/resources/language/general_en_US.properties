# Two-step one-time-password login: a recipient, then the code. The login
# page picks the wording that matches the method's channel.
_ENTER_YOUR_EMAIL=Enter your email
_ENTER_YOUR_PHONE=Enter your phone number
_WE_WILL_SEND_YOU_A_CODE=We will send you a verification code
# {0} is substituted client-side with the recipient the ticket was issued
# to, so the page renders _CODE_SENT until a ticket actually exists.
_ENTER_CODE_SENT_TO=Enter the code sent to {0}
_INVALID_OTP=Incorrect verification code. Try again.
_RESEND_CODE=Resend Code

