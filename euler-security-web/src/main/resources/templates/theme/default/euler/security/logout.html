<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/assets/euler/security/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/assets/euler/security/css/single-form.css}">

    <title th:text="${euler.ctx.__SITE_NAME}">Euler Framework</title>
</head>

<body>
<div class="wrapper">
    <div class="wrapper-inner">
        <div class="title-wrapper">
            <span th:text="#{_SIGN_OUT_CONFIRM}">Are you sure you want to sign out?</span>
        </div>
        <div class="form-wrapper">
            <form th:action="@{${logoutProcessingUrl}}"
                  class="full-line-form"
                  method="post">
                <div class="form-group">
                    <button type="submit" class="btn btn-danger btn-block" th:text="#{_SIGN_OUT}">Sign Out</button>
                </div>
            </form>
        </div>
    </div>
    <footer class="footer-wrapper">
        <span><a href="/static" th:href="@{/}"
                 th:text="${euler.ctx.__SITE_NAME}">Euler Framework</a></span>
        <span>&copy; <span class="js-current-year">2026</span><script>document.querySelector('.js-current-year').textContent = new Date().getFullYear();</script> <a
                href="https://www.eulerproject.io"
                th:href="${euler.ctx.__COPYRIGHT_HOLDER_WEBSITE}"
                th:text="${euler.ctx.__COPYRIGHT_HOLDER}">Euler Project</a></span>
    </footer>
</div>
<!--/*
  * Loaded only so that signing out drops a pending one-time-password
  * ticket; the page has no other scripting. Without it, logging out
  * inside a ticket's lifetime could land the next login screen on the
  * code step holding a credential from the previous session.
  */-->
<script th:src="@{/assets/euler/security/js/euler-form.js}"></script>
</body>
</html>
